services:
  # API + Simulation Viewer UI (same server)
  - type: web
    name: temper-api
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    plan: starter  # or 'free' for testing
    envVars:
      - key: RUST_LOG
        value: info
      - key: DATABASE_PATH
        value: /data/temper.db
      - key: BASE_URL
        value: https://temper-api.onrender.com
      # Add your RPC URLs as secrets in Render dashboard
      # Format: RPC_URL_{CHAIN_NAME}
      - key: RPC_URL_ETHEREUM
        sync: false
      - key: RPC_URL_POLYGON
        sync: false
      - key: RPC_URL_ARBITRUM
        sync: false
      - key: RPC_URL_BASE
        sync: false
      - key: RPC_URL_OPTIMISM
        sync: false
      - key: RPC_URL_HYPER
        sync: false
      - key: RPC_URL_TEMPO_MAINNET
        sync: false
      - key: RPC_URL_TEMPO_TESTNET
        sync: false
      - key: RPC_URL_TEMPO_MODERATO
        sync: false
    disk:
      name: temper-data
      mountPath: /data
      sizeGB: 1

