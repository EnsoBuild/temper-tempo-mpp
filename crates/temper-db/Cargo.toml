[package]
name = "temper-db"
version = "0.1.0"
edition = "2021"
authors = ["Enso Finance"]
license = "MIT"
description = "Database layer for Temper simulations"

[dependencies]
# SQLite
rusqlite = { version = "0.32", features = ["bundled"] }

# ID generation
nanoid = "0.4"

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# errors
eyre = "0.6"
thiserror = "2"

# async
tokio = { version = "1", features = ["full"] }

# logging
log = "0.4"
