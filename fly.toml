app = "temper-api"
primary_region = "iad"

[build]
dockerfile = "Dockerfile"

[env]
RUST_LOG = "info"
PORT = "8089"

[http_service]
internal_port = 8089
force_https = true
auto_stop_machines = false
auto_start_machines = true
min_machines_running = 1

[[http_service.checks]]
grace_period = "10s"
interval = "30s"
method = "GET"
path = "/"
timeout = "5s"

[mounts]
source = "temper_data"
destination = "/data"

[[vm]]
cpu_kind = "shared"
cpus = 2
memory_mb = 1024
