[package]
name = "enso-temper"
version = "0.1.0"
edition = "2021"
authors = ["Enso Finance"]
license = "MIT"
description = "Temper is an Ethereum Transaction Simulator"
homepage = "https://github.com/EnsoFinance/temper"
repository = "https://github.com/EnsoFinance/temper"

[features]
default = ["ethereum"]
# Standard EVM chains (Ethereum, BSC, Polygon, Arbitrum, etc.) - uses latest foundry with alloy
ethereum = ["foundry-evm-ethereum", "foundry-config-ethereum", "dep:revm-inspectors", "dep:alloy-primitives", "dep:alloy-eips"]
# Tempo chain with TIP-20 precompile support - uses tempo-foundry
tempo = ["foundry-evm-tempo", "foundry-config-tempo", "tempo-precompiles", "dep:revm-inspectors", "dep:alloy-primitives", "dep:alloy-eips"]

[dependencies]
# http
warp = "0.3"
tokio = { version = "1", features = ["full"] }

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# bytes
bytes = "1.2.1"
hex = "0.4"

# === COMMON DEPS (used by both features) ===
alloy-primitives = { version = "1.5.1", optional = true }
alloy-eips = { version = "0.15", optional = true }
revm-inspectors = { version = "0.34.0", optional = true }

# === ETHEREUM FEATURE DEPS (latest foundry with alloy) ===
foundry-config-ethereum = { package = "foundry-config", git = "https://github.com/foundry-rs/foundry", rev = "ea7bb4fcf91440dc8a2df76a3aed9498749a1fbb", optional = true }
foundry-evm-ethereum = { package = "foundry-evm", git = "https://github.com/foundry-rs/foundry", rev = "ea7bb4fcf91440dc8a2df76a3aed9498749a1fbb", optional = true }

# === TEMPO FEATURE DEPS (tempo-foundry with TIP-20 support) ===
foundry-config-tempo = { package = "foundry-config", git = "https://github.com/tempoxyz/tempo-foundry", rev = "3f5277634ac023e94cf06ac8534f3b35cffb0f14", optional = true }
foundry-evm-tempo = { package = "foundry-evm", git = "https://github.com/tempoxyz/tempo-foundry", rev = "3f5277634ac023e94cf06ac8534f3b35cffb0f14", optional = true }
tempo-precompiles = { git = "https://github.com/tempoxyz/tempo", rev = "7d2fd47e76f424548c2439eff4c1b4861a58dc2b", optional = true }

# env, logs, errors, uuid
dotenvy = "0.15"
log = "0.4"
pretty_env_logger = "0.4"
eyre = "0.6"
dashmap = "5.4.0"
uuid = { version = "1.3.4", features = ["v4", "fast-rng", "serde"] }

[dev-dependencies]
temp-env = { version = "0.3.4", features = ["async_closure"] }
