[workspace]
resolver = "2"
members = [
    "crates/temper-core",
    "crates/temper-db",
    "crates/temper-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Enso Finance"]
license = "MIT"
homepage = "https://github.com/EnsoFinance/temper"
repository = "https://github.com/EnsoFinance/temper"

[workspace.dependencies]
# Common dependencies shared across crates
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
eyre = "0.6"
log = "0.4"
